# ERCOT Gallery Keyword Vocabulary — controlled concept list
# =============================================================================
# Source of truth for `gallery.keyword_id` and for the keywords the GALLERY
# chart extractor may assign. Hand-edited; `build_keywords_json.py` mirrors it
# into ercot_market_keywords.json, `validate_vocabulary.py` enforces the rules
# below, and `sync_keyword_ids.py` loads it into MySQL.
#
# Three laws, enforced by the validator — a change that breaks one fails loudly:
#
#   1. GENERIC ONLY.  A concept names a recurring idea, never one instance of
#      it. No bill numbers, revision-request numbers, years, months, MW
#      thresholds or named projects. Those live in `rejected:` with a reason.
#   2. ONE CONCEPT, ONE TERM.  No term joins two ideas with "/" or ",". Every
#      alias of a concept must mean the same thing as the concept.
#   3. NO OVERLAP.  No term's words are a subset of another's, and no two
#      concepts may end up tagging substantially the same charts (the validator
#      reports Jaccard >= 0.60 or containment >= 0.90 for merge).
#
# `term` is also the identity: keyword_id = sha1(normalized term)[:12]. Editing
# a term mints a new id, so `replaces:` records the old spelling and the link
# migration follows it. Never recycle a term string for a different meaning.
#
# `status`:
#   active    — in the Gallery keyword picker and in the matcher.
#   candidate — in the matcher but hidden from the picker until it has a chart.
#               Vocabulary we expect to need; costs nothing while unmatched.
#   retired   — out of both. Kept only so its id is never reused.
#
# `glossary_ref` cites ERCOT's own glossary (ercot_glossary.json, refreshed
# nightly from ercot.com/glossary) and is the preferred naming authority. It is
# null only where the glossary genuinely has no entry — it lags the market by
# years and has nothing for ECRS, co-optimization or curtailment — and then
# `extension_reason` must say so.
version: 2
compiled: 2026-11-19
glossary_source: ercot_glossary.json

rules:
  # A surface form shorter than this never matches. "COP" (3 chars) matched a
  # series named "COP HSL" on 522 wind-forecast charts and tagged a third of
  # the gallery with a keyword none of those charts is about.
  min_alias_length: 4
  # An all-caps acronym may be shorter: "RRS" is as distinctive as "Responsive
  # Reserve". What protects a short form is not its length but where it is
  # allowed to match (see weak_fields), which is what the COP incident proved.
  min_acronym_length: 3
  # Where a form has to appear for the match to count. The chart's own title,
  # the text of the PDF page it sits on, and the source document's name each
  # describe the chart as a whole. A series name describes one line on it: a
  # chart plotting a "COP HSL" series mentions COP without being about COP.
  # That alias put a keyword on 522 charts before this rule existed.
  # Listed strongest first: a deliberate label outranks incidental prose
  # when max_keywords_per_chart has to choose.
  qualifying_fields: [title, doc, page]
  weak_fields: [series]
  max_keywords_per_chart: 6
  # Reported for merge, never merged automatically.
  redundancy_jaccard: 0.60
  redundancy_containment: 0.90
  # Containment only means redundancy across a real sample. All 4 PFR charts
  # sit inside RRS's 134; that is hierarchy, not a duplicate concept.
  redundancy_min_charts: 10

# Surface forms too broad to ever be a match, whatever concept claims them.
# Every one of these occurs in hundreds of ERCOT chart titles as a common noun.
blocklist:
  - load
  - demand
  - resource
  - resources
  - energy
  - capacity
  - price
  - prices
  - pricing
  - market
  - markets
  - service
  - services
  - reserve
  - reserves
  - requirement
  - requirements
  - generation
  - profile
  - type
  - types
  - zone
  - zones
  - system
  - ercot
  - texas
  - report
  - chart
  - data
  - total
  - average
  - monthly
  - annual
  - summer
  - winter

facets:
  market-design: Market design & structure
  ancillary-services: Ancillary services (AS)
  scarcity-pricing: Scarcity pricing & reliability economics
  resource-adequacy: Resource adequacy & capacity
  congestion: Congestion & transmission
  storage: Storage / batteries (ESR / BESS)
  renewables: Renewables & inverter-based resources (IBR)
  large-loads: Large loads & demand
  reliability-ops: Reliability & grid operations
  governance: Legislation, regulation & market governance
  settlement: Settlement, metering & participants
  forecasting: Forecasting & forecast performance
  retail: Retail market & load profiling

