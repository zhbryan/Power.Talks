# =============================================================================
# Rejected — terms removed from the vocabulary, with the law each one breaks.
# Kept here so the decision is auditable and nobody re-adds them by accident.
# The charts stay in the gallery; they are simply not reachable by these names.
# =============================================================================
rejected:
- term: Senate Bill 6 (SB6, 2025)
  reason: law 1 — names one bill and one year. Its 4 links were series-name matches.
- term: House Bill 1500 (HB1500)
  reason: law 1 — names one bill. Never matched a chart.
- term: PGRR145 large-load verification
  reason: law 1 — names one revision request. Covered generically by Large flexible load (LFL).
- term: Batch Zero study process
  reason: law 1 — names one interconnection study batch.
- term: "Revision requests: NPRR / NOGRR / NPRR1186 / NPRR1309 / SCR / RRGRR / PGRR / COPMGRR"
  reason: >
    laws 1 and 2 — eight document classes and two specific revision requests in
    one label. Revision requests are already first-class elsewhere in
    Power.Talks (Paper Trails).
- term: Technical Advisory Committee (TAC) / PRS / ROS / WMS / RMS / COPS
  reason: >
    law 2 — six committees in one label. The owning committee is already
    structured metadata on every chart (gallery_charts.doc_group), so it must
    not also be a keyword.
- term: Real-time / day-ahead settlement
  reason: >
    laws 2 and 3 — joins two concepts and duplicates Day-Ahead Market (DAM)
    and Real-Time Market (RTM).
- term: Seasonal / long-term assessments (SARA, CDR, RTBM)
  reason: >
    law 2 — three reports in one label. Split into SARA, the CDR report and
    the Long-Term Reliability Assessment (LTRA).
- term: Marginal pricing / offer curves / bids
  reason: law 2 — split; the matchable part is Energy Offer Curve.
- term: Co-optimization
  reason: >
    law 3 — a subset of Real-Time Co-optimization (RTC+B), which now carries it
    as an alias.
- term: State-of-charge limits in SCED
  reason: law 3 — a subset of State of Charge (SOC), which now carries it.
- term: Mandatory curtailment / firm load shed obligation
  reason: laws 2 and 3 — joins two concepts and duplicates Load shed.
- term: Energy consumption
  reason: law 3 — duplicates Load growth, which carries it as an alias.
